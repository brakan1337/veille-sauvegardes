name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaires:
    name: Publier les binaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Compiler pour chaque système
        run: |
          mkdir dist
          for programme in agent collecteur; do
            for cible in linux/amd64 linux/arm64 windows/amd64; do
              os=${cible%/*}; arch=${cible#*/}
              extension=$([ "$os" = windows ] && echo .exe || true)
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/veille-$programme-$os-$arch$extension" "./cmd/$programme"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
